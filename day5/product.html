<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family: Arial;
            background-color: beige;
            height: 100vh;

            display: flex;  
            justify-content: center;
            gap: 20px;

            align-items: center;
        }
        .product{
            border: 1px solid black;
            width: 350px;
            border-radius: 10px;

            padding: 12px;
            text-align: center;
            margin-bottom: 15px;
            box-shadow: 4px 4px 8px black;

        }

        .product img{
            width: 100%;
            height: 220px;
            object-fit:cover;

        }

        .product:hover{
            background-color: rgb(5, 80, 80);
            color: aliceblue;

            transition: 1s;
            transform: scale(1.03);
        }

        .product button{
            background-color:orange;
            padding: 10px;
            border: none;
            border-radius: 12px;
            width: 90%;
        }
    </style>
</head>
<body>
    </div>

</html>
