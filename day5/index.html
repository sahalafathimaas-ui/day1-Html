<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            background-color: aquamarine;
            width: 300px;
            height: 150px;

            border: 1px solid black;
            border-radius: 10px;

            margin: 10px;
            padding: 10px;

            box-sizing: border-box;
        }
         div p{
            border-bottom: 2px double red;
            padding: 5px;
            
         }
    </style>
</head>
<body>
    <div class="box">
        <p>hello guys</p>

    </div>

    <div class="box">
        <p>books</p>
    </div>
</body>
</html>
