<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label>user name</label>
    <input placeholder="Enter your name"> <br> 

    <!-- input types -->

    <input type="name" placeholder="user name"> <br>
    <input type="email" placeholder="enter a user name"> <br>

    <!-- date and type -->

     <input type="date">
     <input type="day">
     <input type="month">
     <input type="week">
     <input type="datetime-local"> <br>
    

     <!-- selection box -->

     <input type="checkbox">
     <label>i agree to this terms and conditions</label>

     <!-- special input -->

      <input type="file">
      <input type="color">
      <input type="tel" placeholder="phn number" pattern="[0-9]{10}"> <br>

      <!-- validation -->

      <input type="text" minlength="3" maxlength="20"> <br>
      <input type="range">

      <!-- feedback and review -->
       <textarea rows="10" cols="15" placeholder="feedback"></textarea>

    

</body>
</html>
